services:
  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      # Caché cloud (Upstash/Redis Cloud). Si no se define, usa el Redis local de abajo.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGINS: http://localhost:5173
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
